[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iwork-studio"
version = "2.4.1"
description = "Create, edit, design and export Apple Numbers, Keynote and Pages files from any AI agent: verified, reversible, Arabic-safe. MCP server + Python library + agent skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "iWork Studio contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Natural Language :: Arabic",
    "Natural Language :: English",
]
requires-python = ">=3.12"
# Pins mirror skill-pack/references/pins.txt (single source of truth);
# tests/test_packaging.py fails if the two drift apart.
dependencies = [
    "numbers-parser==4.19.0",
    "keynote-parser==1.14.5.0",
    "pdfminer.six==20260107",
    "python-docx==1.2.0",
    "mcp==2.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
]
keywords = ["iwork", "numbers", "keynote", "pages", "mcp", "arabic", "rtl", "agent"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab==5.0.1"]

[project.scripts]
iwork-studio-mcp = "iwork_studio.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Arkanji/iwork-studio"
Repository = "https://github.com/Arkanji/iwork-studio"
Changelog = "https://github.com/Arkanji/iwork-studio/blob/main/CHANGELOG.md"
Issues = "https://github.com/Arkanji/iwork-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]
