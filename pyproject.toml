[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iwork-studio"
version = "2.0.0"
description = "Read and edit Apple Numbers, Keynote and Pages files with verified, reversible, Arabic-safe writes. Python library + MCP server + agent skill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Pins mirror skill-pack/references/pins.txt (single source of truth);
# tests/test_packaging.py fails if the two drift apart.
dependencies = [
    "numbers-parser==4.19.0",
    "keynote-parser==1.14.5.0",
    "PyMuPDF==1.28.2",
    "python-docx==1.2.0",
    "mcp==2.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
]
keywords = ["iwork", "numbers", "keynote", "pages", "mcp", "arabic", "rtl", "agent"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iwork-studio-mcp = "iwork_studio.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Arkanji/iwork-studio"

[tool.setuptools.packages.find]
where = ["src"]
