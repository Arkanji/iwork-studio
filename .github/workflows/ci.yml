name: CI

# Headless lane: everything that does not need a logged-in Mac with iWork.
# .numbers and .key routes are pure Python, so the parsers, every write gate,
# backup/restore and the MCP server are all exercised here on Linux.
# Tests marked `aqua` (live Numbers/Keynote/Pages) run on the Mac only:
#   pytest -m aqua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (pins from pyproject.toml == pins.txt)
        run: pip install -e ".[test]"
      - name: Headless tests
        run: python -m pytest -m "not aqua" -q
