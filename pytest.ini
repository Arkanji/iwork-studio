[pytest]
markers =
    aqua: requires an interactive Aqua session (GUI + Numbers AppleScript)
testpaths = tests
# pytest resets warning filters for each test, so the library silencing does not
# apply here. Both are harmless: numbers-parser not yet listing the newest Numbers
# file version, and the PyMuPDF SWIG bindings on Python 3.12.
filterwarnings =
    ignore:unsupported version:RuntimeWarning
    ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
