<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="iWork Studio — read and edit Apple Numbers, Keynote and Pages with Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d17"/>
      <stop offset="0.55" stop-color="#101426"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f0a"/>
      <stop offset="0.5" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="76" y="86" fill="#8e8e93" font-size="22" letter-spacing="6">APPLE IWORK × PYTHON × AI AGENTS</text>
    <text x="72" y="168" fill="#f5f5f7" font-size="76" font-weight="700">iWork Studio</text>
    <rect x="76" y="192" width="256" height="6" rx="3" fill="url(#accent)"/>
    <text x="76" y="242" fill="#d1d1d6" font-size="26">Read &amp; edit </text>
    <text x="226" y="242" fill="#ff9f0a" font-size="26" font-weight="600">.numbers</text>
    <text x="352" y="242" fill="#d1d1d6" font-size="26"> · </text>
    <text x="374" y="242" fill="#ff375f" font-size="26" font-weight="600">.key</text>
    <text x="440" y="242" fill="#d1d1d6" font-size="26"> · </text>
    <text x="462" y="242" fill="#bf5af2" font-size="26" font-weight="600">.pages</text>
    <text x="554" y="242" fill="#d1d1d6" font-size="26"> — verified, atomic, Arabic-safe.</text>
